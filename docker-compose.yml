services:
  postgres:
    image: postgres:15-alpine
    container_name: rawafri-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rawafri
    volumes:
      - rawafri_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rawafri"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rawafri_pgdata:
